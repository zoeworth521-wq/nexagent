name: Set repo metadata

# 诊断用：尝试用 GITHUB_TOKEN 设置仓库 description 与 topics，
# 并把每一步的 HTTP 状态码与响应体写入 .github/meta-result.json，便于排查。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/set-repo-meta.yml'

jobs:
  set-metadata:
    name: 设置仓库描述与 topics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 尝试设置 description 与 topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          DESC_BODY=$(cat <<'JSON'
          {"description": "面向中文生态的 AI Agent 应用底座：Mastra 内核 + 六家国产大模型适配 + 微信/企微渠道接入 + 合规护栏，全部为可插拔 adapter。"}
          JSON
          )
          DESC_CODE=$(curl -sS -o /tmp/desc.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO" -d "$DESC_BODY")

          TOPICS_BODY=$(cat <<'JSON'
          {"names": ["ai-agent","mastra","llm","typescript","deepseek","qwen","dashscope","glm","kimi","wechat","wecom","chinese-llm"]}
          JSON
          )
          TOPICS_CODE=$(curl -sS -o /tmp/topics.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/topics" -d "$TOPICS_BODY")

          echo "description HTTP $DESC_CODE"
          echo "topics      HTTP $TOPICS_CODE"

          mkdir -p .github
          {
            echo "{"
            echo "  \"description_http\": $DESC_CODE,"
            echo "  \"description_body\": $(cat /tmp/desc.json | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))'),"
            echo "  \"topics_http\": $TOPICS_CODE,"
            echo "  \"topics_body\": $(cat /tmp/topics.json | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')"
            echo "}"
          } > .github/meta-result.json

          cat .github/meta-result.json

      - name: 回写结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/meta-result.json
          git diff --cached --quiet || git commit -m "chore: 记录仓库元数据设置结果 [skip ci]"
          git push || true
