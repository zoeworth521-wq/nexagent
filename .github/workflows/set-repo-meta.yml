name: Set repo metadata

# 用工作流在 GitHub 侧设置仓库描述与 topics。
# 触发方式：修改本文件推送时自动运行，或在 Actions 页面手动 Run workflow。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/set-repo-meta.yml'

jobs:
  set-metadata:
    name: 设置仓库描述与 topics
    runs-on: ubuntu-latest
    steps:
      - name: 设置 Description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "目标仓库：$REPO"
          BODY=$(cat <<'JSON'
          {
            "description": "面向中文生态的 AI Agent 应用底座：Mastra 内核 + 六家国产大模型适配 + 微信/企微渠道接入 + 合规护栏，全部为可插拔 adapter。"
          }
          JSON
          )
          CODE=$(curl -sS -o /tmp/desc.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO" \
            -d "$BODY")
          echo "HTTP $CODE"
          cat /tmp/desc.json || true
          echo
          if [ "$CODE" != "200" ]; then
            echo "::error::设置 description 失败，HTTP $CODE"
            exit 1
          fi

      - name: 设置 Topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BODY=$(cat <<'JSON'
          {
            "names": [
              "ai-agent", "mastra", "llm", "typescript",
              "deepseek", "qwen", "dashscope", "glm",
              "kimi", "wechat", "wecom", "chinese-llm"
            ]
          }
          JSON
          )
          CODE=$(curl -sS -o /tmp/topics.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/topics" \
            -d "$BODY")
          echo "HTTP $CODE"
          cat /tmp/topics.json || true
          echo
          if [ "$CODE" != "200" ]; then
            echo "::error::设置 topics 失败，HTTP $CODE"
            exit 1
          fi

      - name: 结果汇总
        run: echo "仓库元数据设置流程结束"
