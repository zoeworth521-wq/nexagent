version: 2
updates:
  # npm 依赖（含 workspace 内的四个包）
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      # @types/node 必须与最低支持的 Node 运行时版本对齐：
      # 类型定义跳到更高主版本后，编译器会放行运行时不存在的 API，
      # 这类错误只会在生产环境炸出来，本地与 CI 都测不到。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 主版本涉及编译器行为变更，由维护者评估后再手动升级。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    labels:
      - dependencies
    groups:
      # 开发依赖的次要/补丁更新合并成一个 PR，减少噪音
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
